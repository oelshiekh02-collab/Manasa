<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص المشكلة</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>جاري فحص اتصال فايربيس...</h2>
    <h3 id="status" style="color: yellow;">انتظر قليلاً</h3>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDp3uu1IFemjPjdHYMMH9vtz4Sr1SCaz9o",
            authDomain: "altafawuk-c93b4.firebaseapp.com",
            projectId: "altafawuk-c93b4",
            storageBucket: "altafawuk-c93b4.appspot.com",
            messagingSenderId: "682035204936",
            appId: "1:682035204936:web:766a346a441754b76d197d"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            // محاولة جلب البيانات للاختبار
            getDocs(collection(db, "students")).then(() => {
                document.getElementById('status').style.color = 'lightgreen';
                document.getElementById('status').innerText = 'تم الاتصال بقاعدة البيانات بنجاح تام! المشكلة مشكلة كود واجهة مش فايربيس.';
            }).catch(err => {
                document.getElementById('status').style.color = 'red';
                document.getElementById('status').innerText = 'خطأ في قاعدة البيانات: ' + err.message;
            });
        } catch (e) {
            document.getElementById('status').style.color = 'red';
            document.getElementById('status').innerText = 'خطأ في التهيئة: ' + e.message;
        }
    </script>
</body>
</html>
